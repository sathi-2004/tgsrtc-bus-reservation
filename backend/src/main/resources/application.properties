# Server Configuration
server.port=${PORT:8080}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080}


# Database Configuration (MySQL 8)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bus_reservation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration (Override with JWT_SECRET in production)
tgsrtc.app.jwtSecret=${JWT_SECRET:TGSRTC_Default_Dev_Jwt_Secret_Key_Change_In_Production_2026_Minimum_256_Bits!}
tgsrtc.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Payment Gateway Sandbox Configuration (Override with real Razorpay keys in production)
razorpay.keyId=${RAZORPAY_KEY_ID:rzp_test_demo123456789}
razorpay.keySecret=${RAZORPAY_KEY_SECRET:rzp_secret_demo987654321}

# Mail / SMTP Configuration (Optional - override via environment variables)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Logging
logging.level.com.example.busreservation=INFO
logging.level.org.springframework.security=WARN

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

